name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # GitHub's web uploader overwrites files but does not delete old ones.
      # This explicitly removes the MediaProjection implementation from v1.
      - name: Remove obsolete v1 screen recorder
        run: python3 scripts/clean_legacy_sources.py

      - name: Validate source structure
        run: python3 validate_project.py

      - name: Run encoder regression checks
        run: python3 -m unittest discover -s tests -v

      - name: Run codec source regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Renderify-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
