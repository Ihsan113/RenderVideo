plugins {
    id 'com.android.application'
}

android {
    namespace 'id.danzku.renderify'
    compileSdk 35

    defaultConfig {
        applicationId 'id.danzku.renderify'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '3.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig false
    }
}
